<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebAura Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-top: #f2f8ff;
      --bg-bottom: #e8f2ff;
      --card: rgba(255, 255, 255, 0.82);
      --surface: #ffffff;
      --text-main: #11213d;
      --text-soft: #5f6f88;
      --line: #d7e2f2;
      --brand: #0c7ff2;
      --brand-strong: #0865c6;
      --bot-bubble: #f4f9ff;
      --user-bubble: #0c7ff2;
      --user-text: #f8fbff;
      --input-bg: #f7fbff;
      --success: #1d9f75;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text-main);
      font-family: "Manrope", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, #d9ebff 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, #d5f6ed 0%, transparent 40%),
        linear-gradient(170deg, var(--bg-top), var(--bg-bottom));
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 999px;
      filter: blur(70px);
      z-index: 0;
      opacity: 0.65;
      pointer-events: none;
    }

    body::before {
      top: -120px;
      right: -80px;
      background: #c6e4ff;
    }

    body::after {
      bottom: -140px;
      left: -80px;
      background: #bdeedf;
    }

    .chat-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 840px;
      height: min(86vh, 860px);
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 24px;
      box-shadow:
        0 18px 48px rgba(18, 31, 54, 0.16),
        0 4px 20px rgba(12, 127, 242, 0.12);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: appEnter 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    }

    @keyframes appEnter {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .chat-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.95), rgba(242, 248, 255, 0.85));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .title-wrap {
      min-width: 0;
    }

    .chat-header h1 {
      margin: 0;
      font-family: "Space Grotesk", "Manrope", sans-serif;
      font-size: 1.34rem;
      letter-spacing: 0.01em;
    }

    .chat-header .subtitle {
      margin: 0;
      color: var(--text-soft);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #cae5d8;
      background: #ebfbf4;
      color: #1a7559;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 0 rgba(29, 159, 117, 0.4);
      animation: pulse 1.9s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(29, 159, 117, 0.45);
      }
      75% {
        box-shadow: 0 0 0 10px rgba(29, 159, 117, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(29, 159, 117, 0);
      }
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background:
        linear-gradient(180deg, rgba(248, 252, 255, 0.7), rgba(245, 250, 255, 0.45));
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      animation: bubbleEnter 0.24s ease both;
    }

    @keyframes bubbleEnter {
      from {
        opacity: 0;
        transform: translateY(7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      flex-shrink: 0;
      border: 1px solid transparent;
    }

    .message-row.bot .avatar {
      background: #e9f4ff;
      color: #0d4e8f;
      border-color: #c9ddf3;
    }

    .message-row.user .avatar {
      background: #d8ecff;
      color: #10559e;
      border-color: #bbd8f5;
      order: 2;
    }

    .message {
      max-width: min(76%, 620px);
      border-radius: 18px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
      box-shadow: 0 5px 14px rgba(17, 38, 65, 0.06);
    }

    .message-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.76rem;
      margin-bottom: 5px;
      color: var(--text-soft);
      font-weight: 700;
    }

    .message p {
      margin: 0;
    }

    .message.user {
      background: linear-gradient(145deg, #1b8cff, var(--user-bubble));
      color: var(--user-text);
      border-color: rgba(10, 87, 168, 0.42);
    }

    .message.user .message-meta {
      color: rgba(240, 249, 255, 0.87);
    }

    .message.bot {
      background: var(--bot-bubble);
      border-color: #ccddf2;
    }

    .typing-wrap {
      padding: 2px 22px 0;
      min-height: 30px;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-soft);
      font-size: 0.88rem;
      font-weight: 600;
      opacity: 0.95;
    }

    .typing-dots {
      display: inline-flex;
      gap: 4px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9eb3ce;
      animation: dotWave 1.1s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes dotWave {
      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: 0.55;
      }
      40% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    .chat-form {
      border-top: 1px solid var(--line);
      display: flex;
      gap: 10px;
      padding: 16px 18px 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), var(--surface));
    }

    .chat-input {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.98rem;
      outline: none;
      background: var(--input-bg);
      color: var(--text-main);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .chat-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(12, 127, 242, 0.15);
    }

    .send-btn {
      border: none;
      border-radius: 14px;
      background: linear-gradient(145deg, #1c90ff, var(--brand));
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 0.01em;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(12, 127, 242, 0.28);
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    .send-btn:hover {
      filter: brightness(0.95);
      transform: translateY(-1px);
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    @media (max-width: 760px) {
      body {
        padding: 12px;
      }

      .chat-card {
        height: 92vh;
        border-radius: 18px;
      }

      .chat-header {
        padding: 16px;
      }

      .chat-header h1 {
        font-size: 1.18rem;
      }

      .status-chip {
        font-size: 0.74rem;
        padding: 7px 10px;
      }

      .chat-messages {
        padding: 14px;
      }

      .message {
        max-width: 88%;
      }

      .chat-form {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="chat-card">
    <div class="chat-header">
      <div class="title-wrap">
        <h1>WebAura AI Concierge</h1>
        <p class="subtitle">Ask about services, pricing, and project timelines.</p>
      </div>
      <div class="status-chip">
        <span class="status-dot"></span>
        Live Support
      </div>
    </div>

    <div id="chatMessages" class="chat-messages">
      <div class="message-row bot">
        <div class="avatar">WA</div>
        <div class="message bot">
          <div class="message-meta">
            <span>WebAura AI</span>
            <span>Now</span>
          </div>
          <p>Hello! I am WebAura's assistant. How can I help you today?</p>
        </div>
      </div>
    </div>

    <div class="typing-wrap">
      <div id="loadingText" class="typing" hidden>
        WebAura AI is typing
        <span class="typing-dots">
          <span></span><span></span><span></span>
        </span>
      </div>
    </div>

    <form id="chatForm" class="chat-form">
      <input
        id="chatInput"
        class="chat-input"
        type="text"
        placeholder="Type your message..."
        autocomplete="off"
        required
      />
      <button id="sendButton" class="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script>
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const chatMessages = document.getElementById("chatMessages");
    const sendButton = document.getElementById("sendButton");
    const loadingText = document.getElementById("loadingText");

    const API_URL = "/chat";

    function currentTime() {
      return new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function appendMessage(text, role) {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "YOU" : "WA";

      const bubble = document.createElement("div");
      bubble.className = `message ${role}`;

      const meta = document.createElement("div");
      meta.className = "message-meta";

      const sender = document.createElement("span");
      sender.textContent = role === "user" ? "You" : "WebAura AI";

      const time = document.createElement("span");
      time.textContent = currentTime();

      const body = document.createElement("p");
      body.textContent = text;

      meta.appendChild(sender);
      meta.appendChild(time);
      bubble.appendChild(meta);
      bubble.appendChild(body);

      row.appendChild(avatar);
      row.appendChild(bubble);

      chatMessages.appendChild(row);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function setLoading(isLoading) {
      loadingText.hidden = !isLoading;
      sendButton.disabled = isLoading;
      chatInput.disabled = isLoading;
    }

    chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const userMessage = chatInput.value.trim();
      if (!userMessage) return;

      appendMessage(userMessage, "user");
      chatInput.value = "";
      setLoading(true);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ message: userMessage }),
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const data = await response.json();
        appendMessage(data.reply || "No reply received.", "bot");
      } catch (error) {
        appendMessage(
          "Sorry, something went wrong while contacting the server.",
          "bot"
        );
        console.error(error);
      } finally {
        setLoading(false);
        chatInput.focus();
      }
    });
  </script>
</body>
</html>
