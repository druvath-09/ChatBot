<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebAura Chatbot</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #1b1f2a;
      --muted: #6b7280;
      --accent: #0f766e;
      --accent-hover: #115e59;
      --user-bubble: #d1fae5;
      --bot-bubble: #e0e7ff;
      --border: #dbe1ea;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f4f7fb 0%, #e7eef8 100%);
      color: var(--text);
      padding: 16px;
    }

    .chat-card {
      width: 100%;
      max-width: 720px;
      height: 80vh;
      max-height: 760px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(17, 24, 39, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
    }

    .chat-header h1 {
      font-size: 1.1rem;
      margin: 0;
    }

    .chat-header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fcfdff;
    }

    .message {
      max-width: 80%;
      padding: 10px 12px;
      border-radius: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border: 1px solid #a7f3d0;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot-bubble);
      border: 1px solid #c7d2fe;
    }

    .chat-form {
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      padding: 14px;
      background: #ffffff;
    }

    .chat-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 1rem;
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }

    .send-btn {
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      padding: 10px 16px;
      cursor: pointer;
    }

    .send-btn:hover {
      background: var(--accent-hover);
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading {
      color: var(--muted);
      font-style: italic;
      font-size: 0.92rem;
      padding: 0 16px 12px;
    }

    @media (max-width: 640px) {
      .chat-card {
        height: 88vh;
      }

      .message {
        max-width: 92%;
      }
    }
  </style>
</head>
<body>
  <div class="chat-card">
    <div class="chat-header">
      <h1>WebAura Assistant</h1>
      <p>Ask about services, pricing, or how to get started.</p>
    </div>

    <div id="chatMessages" class="chat-messages">
      <div class="message bot">Hello! I am WebAura's assistant. How can I help you today?</div>
    </div>

    <div id="loadingText" class="loading" hidden>Thinking...</div>

    <form id="chatForm" class="chat-form">
      <input
        id="chatInput"
        class="chat-input"
        type="text"
        placeholder="Type your message..."
        autocomplete="off"
        required
      />
      <button id="sendButton" class="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script>
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const chatMessages = document.getElementById("chatMessages");
    const sendButton = document.getElementById("sendButton");
    const loadingText = document.getElementById("loadingText");

    const API_URL = "/chat";

    function appendMessage(text, role) {
      const bubble = document.createElement("div");
      bubble.className = `message ${role}`;
      bubble.textContent = text;
      chatMessages.appendChild(bubble);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function setLoading(isLoading) {
      loadingText.hidden = !isLoading;
      sendButton.disabled = isLoading;
      chatInput.disabled = isLoading;
    }

    chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const userMessage = chatInput.value.trim();
      if (!userMessage) return;

      appendMessage(userMessage, "user");
      chatInput.value = "";
      setLoading(true);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ message: userMessage }),
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const data = await response.json();
        appendMessage(data.reply || "No reply received.", "bot");
      } catch (error) {
        appendMessage(
          "Sorry, something went wrong while contacting the server.",
          "bot"
        );
        console.error(error);
      } finally {
        setLoading(false);
        chatInput.focus();
      }
    });
  </script>
</body>
</html>
